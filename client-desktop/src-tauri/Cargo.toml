[package]
name = "echo-desktop"
version = "1.0.0"
description = "Echo - Plataforma Privada de Comunicación en Tiempo Real"
authors = ["Echo Architecture Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5.4", features = [] }

[dependencies]
tauri = { version = "1.6.8", features = ["shell-open", "global-shortcut", "notification", "window-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
winreg = "0.52"
uuid = { version = "1.8", features = ["v4"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
